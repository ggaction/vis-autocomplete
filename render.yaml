services:
  - type: web
    name: visualization-autocomplete
    runtime: docker
    repo: https://github.com/ggaction/vis-autocomplete
    branch: main
    plan: 0.5c-512mb
    region: frankfurt
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeployTrigger: 'off'
    domains:
      - vis.autocomplete.studio
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_PUBLISHABLE_KEY
        sync: false
      - key: NODE_ENV
        value: production
