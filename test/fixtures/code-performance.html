<!doctype html>
<meta charset="utf-8">
<title>Long-session code preview performance</title>
<link rel="stylesheet" href="/web/style.css">
<style>body{padding:24px}.code-panel{width:600px;height:500px}</style>
<section class="panel code-panel"><pre id="code"></pre></section>
<script type="module">
import { programCode, renderCode, resetCodeView, displayedCode } from '/web/code-view.js';
const host = document.querySelector('#code');
const setup = { method: 'createCanvas', args: { width: 600, height: 450 } };
const calls = [setup, ...Array.from({ length: 1000 }, (_, i) => ({
  method: 'encodeOpacity', args: { target: 'plot', value: (i % 10 + 1) / 10 },
}))];
const current = programCode(calls);
const proposed = Array.from({ length: 5 }, (_, i) => programCode([...calls,
  { method: 'encodeColor', args: { target: 'plot', value: ['red', 'blue', 'green', 'orange', 'purple'][i] } },
]));
renderCode(host, current, null, { setupCallCount: 1 });
window.harness = {
  host, calls, current, proposed, renderCode, resetCodeView, displayedCode,
  hover(index, options = {}) { renderCode(host, current, proposed[index % proposed.length], { setupCallCount: 1, ...options }); },
  leave() { renderCode(host, current, null, { setupCallCount: 1 }); },
};
</script>
