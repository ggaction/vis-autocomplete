<!doctype html><html lang="en"><meta charset="utf-8"><title>Vector thumbnail regression</title>
<script type="importmap">{"imports":{"ggaction":"/node_modules/ggaction/src/index.js","ggaction/svg":"/node_modules/ggaction/src/renderers/svg.js"}}</script>
<style>body{margin:0;background:white}.pair{display:flex;gap:10px}.original,.thumbnail{width:350px;height:215px}.pair svg{width:100%;height:100%;display:block}</style>
<body><script type="module">
import {chart} from 'ggaction';
import {renderToSVG} from 'ggaction/svg';
import {renderChartThumbnail} from '/web/chart-thumbnail.js';
const rows=Array.from({length:80},(_,i)=>({X:i+1,Y:i%15+1,C:i%2?'A & B':'<C>'}));
const base=()=>chart().createCanvas({width:700,height:430,margin:{left:80,right:180,top:50,bottom:60}}).createData({id:'data',values:rows});
const programs=[
 base().createScatterPlot({id:'plot',x:'X',y:'Y',color:{field:'X',fieldType:'quantitative'}}).createGuides(),
 base().createScatterPlot({id:'plot',x:'X',y:'Y',color:'C'}).facet({data:'data',field:'C',columns:2}).createGuides(),
 base().createPiePlot({id:'plot',category:'C',value:'Y'}).createGuides()
];
for(const program of programs){
 const pair=document.createElement('div');pair.className='pair';
 const original=document.createElement('div');original.className='original';
 const thumb=document.createElement('div');thumb.className='thumbnail';
 const source=renderToSVG(program);original.innerHTML=source;
 renderChartThumbnail(thumb,program,source,'Native chart thumbnail');
 pair.append(original,thumb);document.body.append(pair);
 if(decodeURIComponent(thumb.querySelector('image').getAttribute('href').split(',').slice(1).join(','))!==source)throw new Error('Thumbnail changed the native SVG source');
 if(thumb.querySelectorAll('svg *').length!==1)throw new Error('A thumbnail copied the native mark DOM');
}
window.ready=true;
</script></body></html>
