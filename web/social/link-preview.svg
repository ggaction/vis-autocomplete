<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <title>VisAutocomplete</title>
  <desc>Build your chart one step at a time. A chart and three colorful recommendation cards illustrate the authoring process.</desc>
  <defs>
    <linearGradient id="background" x2="1" y2="1">
      <stop stop-color="#f8fafc"/>
      <stop offset="1" stop-color="#eef4fb"/>
    </linearGradient>
    <linearGradient id="area" x2="0" y2="1">
      <stop stop-color="#096bc2" stop-opacity=".18"/>
      <stop offset="1" stop-color="#096bc2" stop-opacity=".02"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="160%">
      <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#173a61" flood-opacity=".08"/>
    </filter>
  </defs>
  <rect width="1200" height="630" fill="url(#background)"/>
  <path d="M1192 26v578" stroke="#d4e5f6" stroke-width="2"/>
  <g transform="translate(56 52)">
