          <circle cx="158" cy="154" r="5"/><circle cx="180" cy="133" r="6"/><circle cx="203" cy="143" r="5"/>
          <circle cx="231" cy="118" r="7"/><circle cx="249" cy="130" r="5"/><circle cx="272" cy="101" r="6"/>
